name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          DATE=$(date -u +"%Y%m%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION="v${DATE}.${COUNT}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${VERSION}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: dengtai-backend
        run: mvn package -DskipTests -q

      - name: Rename backend artifact
        run: |
          JAR=$(ls dengtai-backend/target/*.jar | grep -v 'original' | head -1)
          cp "$JAR" "dengtai-backend-${{ steps.version.outputs.version }}.jar"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dengtai-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: dengtai-frontend
        run: npm ci

      - name: Build frontend
        working-directory: dengtai-frontend
        run: npm run build

      - name: Package frontend dist
        run: |
          tar -czf "dengtai-frontend-${{ steps.version.outputs.version }}.tar.gz" \
            -C dengtai-frontend dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dengtai-backend-${{ steps.version.outputs.version }}.jar
            dengtai-frontend-${{ steps.version.outputs.version }}.tar.gz

  docker:
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: dengtai-backend
        run: mvn package -DskipTests -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: dengtai-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dengtai-backend:${{ needs.build-and-release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/dengtai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
