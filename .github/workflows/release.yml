name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  # ─── Job 1: 构建前后端，发布 GitHub Release ───────────────────────────────
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本号
        id: version
        run: |
          DATE=$(date -u +"%Y%m%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION="v${DATE}.${COUNT}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号: ${VERSION}"

      # ── 后端构建 ──
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 构建后端 JAR
        working-directory: dengtai-backend
        run: mvn package -DskipTests -q

      - name: 重命名后端产物
        run: |
          JAR=$(ls dengtai-backend/target/*.jar | grep -v 'original' | head -1)
          cp "$JAR" "dengtai-backend-${{ steps.version.outputs.version }}.jar"

      # ── 前端构建 ──
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dengtai-frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: dengtai-frontend
        run: npm ci

      - name: 构建前端
        working-directory: dengtai-frontend
        run: npm run build

      - name: 打包前端产物
        run: |
          tar -czf "dengtai-frontend-${{ steps.version.outputs.version }}.tar.gz" \
            -C dengtai-frontend dist/

      # ── GitHub Release ──
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dengtai-backend-${{ steps.version.outputs.version }}.jar
            dengtai-frontend-${{ steps.version.outputs.version }}.tar.gz

  # ─── Job 2: 推送 Docker 镜像到 GitHub Container Registry ─────────────────
  # GHCR 使用内置 GITHUB_TOKEN，无需配置任何额外 Secret
  docker:
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21（构建 JAR 用于 Docker）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 构建后端 JAR
        working-directory: dengtai-backend
        run: mvn package -DskipTests -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像到 GHCR
        uses: docker/build-push-action@v6
        with:
          context: dengtai-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dengtai-backend:${{ needs.build-and-release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/dengtai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 可选：同时推送到 Docker Hub（需配置 DOCKER_USERNAME / DOCKER_PASSWORD Secret）──
      - name: 登录 Docker Hub（如已配置 Secret）
        if: ${{ secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 推送镜像到 Docker Hub（如已配置 Secret）
        if: ${{ secrets.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v6
        with:
          context: dengtai-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dengtai-backend:${{ needs.build-and-release.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/dengtai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
