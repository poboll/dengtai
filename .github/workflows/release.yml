name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          DATE=$(date -u +"%Y%m%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION="v${DATE}.${COUNT}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${VERSION}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: dengtai-backend
        run: mvn package -DskipTests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dengtai-frontend/package-lock.json

      - name: Build frontend
        working-directory: dengtai-frontend
        run: |
          npm ci
          npm run build

      - name: Package frontend dist
        run: |
          cd dengtai-frontend
          tar -czf ../dengtai-frontend-${{ steps.version.outputs.version }}.tar.gz dist/

      - name: Copy backend JAR for release
        run: |
          cp dengtai-backend/target/*.jar dengtai-backend-${{ steps.version.outputs.version }}.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: dengtai-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            caiths/dengtai-backend:${{ steps.version.outputs.version }}
            caiths/dengtai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dengtai-backend-${{ steps.version.outputs.version }}.jar
            dengtai-frontend-${{ steps.version.outputs.version }}.tar.gz
