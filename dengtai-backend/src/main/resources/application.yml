server:
  port: 8082


spring:
  application:
    name: dengtai
  datasource:
    url: jdbc:mysql://localhost:3306/dengtai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20             # 连接池最大连接数
      minimum-idle: 5                   # 最小空闲连接
      idle-timeout: 600000              # 10 分钟：空闲多久回收
      max-lifetime: 1700000             # 约 28 分钟
      keepalive-time: 300000            # 5 分钟发一次"保活"
      connection-timeout: 30000             # 30 秒拿不到连接就报错
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms                   # 命令执行超时
      connect-timeout: 1000ms           # 连接建立超时
      lettuce:
        pool:
          max-active: 16                # 最大活跃连接数（与 Hikari 对齐）
          max-idle: 8                   # 最大空闲连接数
          min-idle: 2                   # 最小空闲连接数（预热，降低首次延迟）
          max-wait: 1000ms              # 获取连接最长等待时间
        shutdown-timeout: 200ms         # 优雅停机等待时间
  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: counter-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                         # 等待所有 ISR 副本确认（Kafka 4.0 已为默认值，显式保留以明确语义）
      retries: 3
      linger-ms: 10                     # 批次等待时长（毫秒整型，适配 Kafka 4.0 客户端）
      # Kafka 4.0 起，enable.idempotence=true 与 max.in.flight.requests.per.connection=5 已为默认值，无需显式声明
    consumer:
      group-id: counter-agg
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      type: single
      ack-mode: manual
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
    openai:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${SILICONFLOW_API_KEY:PLACEHOLDER_NOT_CONFIGURED}
      embedding:
        options:
          model: BAAI/bge-large-zh-v1.5
          dimensions: 1024
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: dengtai-ai-index
        dimensions: 1024
  elasticsearch:
    uris: http://localhost:9012

canal:
  enabled: true
  host: localhost
  port: 11111
  destination: example
  username: "canal"
  password: "Canal@123456"
  filter: dengtai.outbox
  batchSize: 1000
  intervalMs: 1000

counter:
  rebuild:
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: dengtai
    key-id: dengtai-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
    dev-return-code: true
  password:
    bcrypt-strength: 12
    min-length: 8

logging:
  level:
    root: INFO
    '[com.caiths.dengtai]': DEBUG

oss:
  access-key: ${QINIU_ACCESS_KEY}
  secret-key: ${QINIU_SECRET_KEY}
  bucket: xint
  domain: https://qixint.caiths.com
  folder: dengtai


cache:
  l2:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
    mine-cfg:
      ttl-seconds: 10
      max-size: 1000
  hotkey:
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
